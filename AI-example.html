<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First HTML Page</title>
    <style>
        nav ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            background-color: #333;
        }
        nav ul li {
            margin: 0;
            padding: 14px 20px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
        }
        nav ul li:hover {
            background-color: #111;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">My Labs</a></li>
            <li><a href="#">Contact Me</a></li>
        </ul>
    </nav>

    <h1>First Paragraph</h1>
    <p>Hello World</p>

    <h1>Second Paragraph</h1>
    <p>This is the second paragraph. It contains at least three sentences. HTML is a markup language used to create web pages.</p>
</body>
</html>
